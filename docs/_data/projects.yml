- id: wear-it-virtually
  name: Wear It Virtually
  year: "2020"
  context: Computer-vision project
  categories: [ai]
  placement: selected
  badge: Computer vision
  summary: Deep-learning virtual try-on. Send a photo and a garment, and the pipeline parses the body, estimates pose and renders you wearing it.
  highlights:
    - Human parsing (JPPNet) and pose estimation feed a VITON-style warping and refinement network
    - Flask REST API that takes person and clothing images and returns the try-on render
  stack: [Python, TensorFlow, OpenCV, Flask]
  terminal:
    - "$ POST /api/infer"
    - "person.jpg + garment.jpg"
    - "parse → pose → warp → render"
  links:
    - label: Code
      url: https://github.com/11fenil11/Wear-It-Virtually

