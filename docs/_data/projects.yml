- id: cloudbnb
  name: CloudBnB
  year: "2022"
  context: Dalhousie · graduate team project
  categories: [cloud, ai]
  placement: featured
  badge: Serverless · multi-cloud
  summary: A serverless, multi-cloud bed-and-breakfast platform. Bookings, food orders and tours run on AWS, while Google Cloud ML services recommend tour packages and score guest feedback.
  highlights:
    - Lambda and API Gateway microservices over DynamoDB for rooms, orders, tours and feedback
    - Amazon Lex chatbots for booking, food ordering and site navigation
    - Vertex AI tour-package prediction (my module) and Cloud Natural Language sentiment analysis
    - Multi-factor sign-in with a security-question and cipher challenge
  stack: [AWS Lambda, API Gateway, DynamoDB, Amazon Lex, Vertex AI, Cloud Functions, React]
  terminal:
    - "$ deploy cloudbnb"
    - "aws: lambda · lex · dynamodb"
    - "gcp: vertex ai · natural language"
  links:
    - label: Code
      url: https://github.com/11fenil11/CloudBnB

- id: daldbms
  name: DalDBMS
  year: "2022"
  context: Dalhousie · graduate team project
  categories: [systems, cloud]
  placement: featured
  badge: Database internals
  summary: A database engine written from scratch in Java, with SQL parsing and execution, lock-based transactions, and storage distributed across two Google Cloud VMs.
  highlights:
    - Query processor for CREATE, USE, INSERT, SELECT, UPDATE and DELETE
    - Transaction manager with shared and exclusive locks for concurrency control
    - Query, event and analytics logs; ERD reverse-engineering and SQL dump export
    - Login with hashed credentials
  stack: [Java, Maven, Google Compute Engine, Concurrency control]
  terminal:
    - "$ daldbms --nodes=2"
    - "sql → parse → lock → commit"
    - "java · transactions · gcp vms"
  links:
    - label: Code
      url: https://github.com/11fenil11/DalDBMS

