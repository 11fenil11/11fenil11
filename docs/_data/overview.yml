# "How I build systems": the delivery loop on the left, a layered stack diagram on the right.

intro: This is how I take a system from the first diagram to production traffic.

steps:
  - title: Design
    text: Start from the requirements and the expected load. Sketch the services, data flows and security boundaries, then choose the simplest architecture that will scale.
  - title: Build
    text: Write the infrastructure as reusable Terraform and the services in Python or Java, with clean APIs and least-privilege access from day one.
  - title: Test
    text: Automate unit, integration and data-validation checks so problems surface in the pipeline, not in production.
  - title: Deploy
    text: Ship through CI/CD, promote from dev to staging to production, and roll out across regions with planned, low-risk cutovers.
  - title: Scale
    text: Put load balancing and TLS in front, scale out horizontally, and tune concurrency and fan-out until throughput meets the target.
  - title: Operate
    text: Watch dashboards and logs, support production, and let AI agents take the first pass at triage.

layers:
  - verb: automate
    name: Agentic AI & automation
    tone: gold
    items: [Multi-agent LLMs, Amazon Bedrock, Tool connectors, FastAPI services, Triage automation]
  - verb: serve
    name: Services & APIs
    tone: red
    items: [REST APIs, Microservices, Spring Boot · FastAPI, Event-driven (SNS · SQS), Load balancing · TLS]
  - verb: scale
    name: Data & distributed processing
    tone: blue
    items: [Apache Spark, Serverless fan-out, Athena · S3 · Parquet, Search services, Data sync]
  - verb: ship
    name: Platform & delivery
    tone: green
    items: [Kubernetes (AKS · GKE), Docker, GitHub Actions · Jenkins, Automated testing, Datadog · Splunk]
  - verb: codify
    name: Cloud foundations as code
    tone: ink
    items: [Terraform modules, AWS · GCP · Azure, Multi-region, IAM · KMS]

rail:
  name: Security & compliance
  items: [Least-privilege IAM, KMS encryption, TLS in transit, Secretless workload identity, Patched dependencies, PII-safe reporting, Audit trails]
